name: VRT Alert Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: '실행할 작업'
        required: true
        default: 'actual_startup_digest'
        type: choice
        options:
          - actual_startup_digest
          - actual_monitor_normal
          - actual_monitor_close
          - actual_monitor_morning
          - actual_monitor_weekly
          - actual_monitor_13f
          - actual_market_scan
          - actual_dca_status
          - actual_dca_update
          - live_smoke
          - sample_delivery_smoke
      ticker:
        description: '대상 ticker'
        required: false
        default: 'VRT'
      dca_shares:
        description: 'DCA 추가 수량(actual_dca_update 전용)'
        required: false
      dca_price:
        description: 'DCA 매수가(actual_dca_update 전용)'
        required: false
      require_slack:
        description: 'live_smoke에서 Slack까지 필수 확인'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run selected alert action
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          MARKET_SCAN_WEBHOOK: ${{ secrets.MARKET_SCAN_WEBHOOK }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT:        ${{ secrets.SEC_CONTACT }}
          SEC_USER_AGENT:     ${{ secrets.SEC_USER_AGENT }}
          SEC_LEGACY_USER_AGENT: ${{ secrets.SEC_LEGACY_USER_AGENT }}
          DCA_SHARES_INPUT:   ${{ github.event.inputs.dca_shares }}
          DCA_PRICE_INPUT:    ${{ github.event.inputs.dca_price }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          TICKER="${{ github.event.inputs.ticker }}"
          if [ -z "$TICKER" ]; then
            TICKER="VRT"
          fi

          export MONITOR_TICKER="$TICKER"
          export MARKET_SCAN_FOCUS_TICKER="$TICKER"
          echo "Selected action: $ACTION / ticker: $TICKER"

          case "$ACTION" in
            actual_startup_digest)
              python startup_digest.py
              ;;
            actual_monitor_normal)
              RUN_MODE=normal python hood_monitor.py
              ;;
            actual_monitor_close)
              RUN_MODE=close python hood_monitor.py
              ;;
            actual_monitor_morning)
              RUN_MODE=morning python hood_monitor.py
              ;;
            actual_monitor_weekly)
              RUN_MODE=weekly python hood_monitor.py
              ;;
            actual_monitor_13f)
              RUN_MODE=13f python hood_monitor.py
              ;;
            actual_market_scan)
              python market_scan.py --ticker "$TICKER"
              ;;
            actual_dca_status)
              RUN_MODE=dca_status python hood_monitor.py
              ;;
            actual_dca_update)
              DCA_SHARES="$DCA_SHARES_INPUT" DCA_PRICE="$DCA_PRICE_INPUT" RUN_MODE=dca_update python hood_monitor.py
              ;;
            live_smoke)
              if [ "${{ github.event.inputs.require_slack }}" = "true" ]; then
                python live_smoke.py --require-slack
              else
                python live_smoke.py --no-slack
              fi
              ;;
            sample_delivery_smoke)
              python alert_delivery_smoke.py
              ;;
            *)
              echo "Unknown action: $ACTION"
              exit 1
              ;;
          esac

      - name: Commit state files
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state/*/*.json state.json weekly_state.json beta_cache.json app_rank_cache.json *_state.json *_weekly_state.json *_beta_cache.json *_app_rank_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git push || true
