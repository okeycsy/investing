name: Monitor V2 Runtime Shadow

on:
  schedule:
    # UTC windows cover 04:00-20:00 New York across both DST offsets.
    # TickPlanner applies the exchange calendar and exact active-session guard.
    - cron: '3-58/5 8-23 * * 1-5'
    - cron: '3-58/5 0-3 * * 2-6'
    # Monday 08:13 KST weekly review wake-up.
    - cron: '13 23 * * 0'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/monitor_v2_shadow.yml'
      - 'src/investing_monitor/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Foundation check to run'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - status
          - doctor
          - market
          - shadow
      persist_state:
        description: 'Checkpoint the SQLite snapshot to runtime-state'
        required: true
        type: boolean
        default: false

concurrency:
  group: ticker-monitor-v2-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package
        run: |
          pip install -e . yfinance

      - name: Install legacy test dependencies
        if: github.event_name != 'schedule'
        run: pip install -r requirements.txt

      - name: Run full test suite
        if: github.event_name != 'schedule'
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Restore runtime state
        run: investing-monitor --db .runtime/monitor.db restore-state

      - name: Plan due tasks
        if: github.event_name == 'push' || inputs.mode == 'plan'
        run: investing-monitor --db .runtime/monitor.db plan

      - name: Run market shadow tick
        if: inputs.mode == 'market'
        run: investing-monitor --db .runtime/monitor.db market-tick --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Run unified shadow tick
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'shadow'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT: maybe2213@naver.com
        run: investing-monitor --db .runtime/monitor.db shadow-tick --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Show runtime status
        if: inputs.mode == 'status'
        run: investing-monitor --db .runtime/monitor.db status

      - name: Run foundation doctor
        if: inputs.mode == 'doctor'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: investing-monitor --db .runtime/monitor.db doctor --require-secrets

      - name: Checkpoint runtime state
        if: always() && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.persist_state)
        run: investing-monitor --db .runtime/monitor.db checkpoint-state --run-id "${{ github.run_id }}"
