name: Monitor V2 Runtime Shadow

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/monitor_v2_shadow.yml'
      - 'src/investing_monitor/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Foundation check to run'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - status
          - doctor
          - market
          - shadow
          - replay
      persist_state:
        description: 'Checkpoint the SQLite snapshot to runtime-state'
        required: true
        type: boolean
        default: false

concurrency:
  group: ticker-monitor-v2-shadow-state
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Read workflow trigger time
        id: run-metadata
        uses: actions/github-script@v8
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            core.setOutput('created_at', run.created_at);

      - name: Install package
        run: |
          pip install -e . yfinance

      - name: Install legacy test dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Restore isolated shadow state
        run: investing-monitor --db .runtime/monitor.db restore-state --branch runtime-shadow-state

      - name: Plan due tasks
        if: github.event_name == 'push' || inputs.mode == 'plan'
        run: investing-monitor --db .runtime/monitor.db plan

      - name: Run market shadow tick
        if: inputs.mode == 'market'
        run: investing-monitor --db .runtime/monitor.db market-tick --scheduled-at "${{ steps.run-metadata.outputs.created_at }}" --trigger "${{ github.event_name }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Run unified shadow tick
        if: github.event_name == 'push' || inputs.mode == 'shadow'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT: maybe2213@naver.com
        run: investing-monitor --db .runtime/monitor.db shadow-tick --scheduled-at "${{ steps.run-metadata.outputs.created_at }}" --trigger "${{ github.event_name }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Build product quality report
        if: always() && (github.event_name == 'push' || inputs.mode == 'shadow')
        continue-on-error: true
        run: investing-monitor --db .runtime/monitor.db quality-report

      - name: Replay three completed trading days
        if: inputs.mode == 'replay'
        run: investing-monitor replay-market --days 3

      - name: Show runtime status
        if: inputs.mode == 'status'
        run: investing-monitor --db .runtime/monitor.db status

      - name: Run foundation doctor
        if: inputs.mode == 'doctor'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: investing-monitor --db .runtime/monitor.db doctor --require-secrets

      - name: Checkpoint isolated shadow state
        if: always() && (github.event_name == 'push' || inputs.persist_state)
        run: investing-monitor --db .runtime/monitor.db checkpoint-state --branch runtime-shadow-state --run-id "${{ github.run_id }}"
