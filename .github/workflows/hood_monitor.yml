name: VRT Monitor

on:
  schedule:
    # NYSE calendar router decides actual normal/close/morning runs.
    - cron: '0,30 8-23 * * 1-5'
    - cron: '0,30 0-1 * * 2-6'

    # Asia fixed-time jobs. Router keeps one run via dispatch keys.
    - cron: '0,30 23 * * 0'     # weekly: Monday 08:00 KST/JST
    - cron: '0,30 10 * * 6'     # 13F: Saturday 19:00 KST/JST

  workflow_dispatch:
    inputs:
      mode:
        description: 'RUN_MODE (normal/close/morning/weekly/13f/dca_status/dca_update)'
        required: true
        default: 'normal'
      dca_shares:
        description: 'DCA_SHARES (dca_update 전용)'
        required: false
      dca_price:
        description: 'DCA_PRICE (dca_update 전용)'
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scheduler dependency
        if: github.event_name != 'workflow_dispatch'
        run: pip install 'pandas_market_calendars>=5.4.0,<6.0'

      - name: Determine RUN_MODE
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "dispatch_key=" >> $GITHUB_OUTPUT
            echo "reason=manual dispatch" >> $GITHUB_OUTPUT
            exit 0
          fi

          python market_calendar.py monitor --github-output "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.mode.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run Ticker Monitor
        if: steps.mode.outputs.should_run == 'true'
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT:        ${{ secrets.SEC_CONTACT }}
          SEC_USER_AGENT:     ${{ secrets.SEC_USER_AGENT }}
          SEC_LEGACY_USER_AGENT: ${{ secrets.SEC_LEGACY_USER_AGENT }}
          RUN_MODE:           ${{ steps.mode.outputs.mode }}
          SCHEDULED_RUN:      ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          SCHEDULE_DISPATCH_KEY: ${{ steps.mode.outputs.dispatch_key }}
          DCA_SHARES:         ${{ github.event.inputs.dca_shares }}
          DCA_PRICE:          ${{ github.event.inputs.dca_price }}
        run: python hood_monitor.py

      - name: Commit state files
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state/*/*.json state.json weekly_state.json beta_cache.json app_rank_cache.json *_state.json *_weekly_state.json *_beta_cache.json *_app_rank_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git push || true
