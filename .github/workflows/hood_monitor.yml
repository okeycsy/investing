name: Ticker Monitor

concurrency:
  group: ticker-monitor-state
  cancel-in-progress: false

on:
  schedule:
    # ── 장중 normal (프리+정규+애프터) ──────────────────────
    # DST 양쪽 후보를 예약하고 아래 단계에서 NY 평일 04:00~19:59만 실행한다.
    - cron: '0 8-23 * * 1-5'    # UTC 월~금 관련 거래 시간대
    - cron: '0 0-1 * * 2-6'     # UTC 자정 이후의 전일 NY 애프터마켓

    # ── close: New York 17:10, DST 자동 선택 ─────────────────
    # 두 UTC 후보 중 실행 시점이 실제 17시인 작업만 진행한다.
    - cron: '10 21 * * 1-5'
    - cron: '10 22 * * 1-5'

    # ── weekly: 월요일 KST 08:00 = UTC 23:00 (일요일) ────────
    - cron: '0 23 * * 0'        # UTC 일요일 23:00 = KST 월요일 08:00

    # ── 13F: 토요일 KST 19:00 = UTC 10:00 ───────────────────
    - cron: '0 10 * * 6'        # UTC 토요일 10:00 = KST 19:00

  workflow_dispatch:
    inputs:
      mode:
        description: 'RUN_MODE (normal/preview/close/weekly/13f)'
        required: true
        default: 'normal'
      preview_change_pct:
        description: 'preview 모드 가정 등락률'
        required: false
        default: '4.0'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine RUN_MODE
        id: mode
        run: |
          # workflow_dispatch이면 입력값 우선
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # schedule이면 UTC 시간 기준으로 자동 판별
          SCHEDULE="${{ github.event.schedule }}"
          case "$SCHEDULE" in
            "10 21 * * 1-5"|"10 22 * * 1-5")
              NY_OFFSET=$(TZ=America/New_York date +%z)
              if { [ "$SCHEDULE" = "10 21 * * 1-5" ] && [ "$NY_OFFSET" = "-0400" ]; } || \
                 { [ "$SCHEDULE" = "10 22 * * 1-5" ] && [ "$NY_OFFSET" = "-0500" ]; }; then
                echo "mode=close" >> $GITHUB_OUTPUT
              else
                echo "mode=skip" >> $GITHUB_OUTPUT
              fi
              ;;
            "0 23 * * 0") echo "mode=weekly" >> $GITHUB_OUTPUT ;;
            "0 10 * * 6") echo "mode=13f" >> $GITHUB_OUTPUT ;;
            *)
              NY_DOW=$(TZ=America/New_York date +%u)
              NY_HOUR=$(TZ=America/New_York date +%H)
              if [ "$NY_DOW" -le 5 ] && [ "$NY_HOUR" -ge 4 ] && [ "$NY_HOUR" -lt 20 ]; then
                echo "mode=normal" >> $GITHUB_OUTPUT
              else
                echo "mode=skip" >> $GITHUB_OUTPUT
              fi
              ;;
          esac

      - name: Run Ticker Monitor
        if: steps.mode.outputs.mode != 'skip'
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT:        ${{ secrets.SEC_CONTACT }}
          SEC_USER_AGENT:     ${{ secrets.SEC_USER_AGENT }}
          SEC_LEGACY_USER_AGENT: ${{ secrets.SEC_LEGACY_USER_AGENT }}
          RUN_MODE:           ${{ steps.mode.outputs.mode }}
          PREVIEW_CHANGE_PCT: ${{ github.event.inputs.preview_change_pct }}
        run: python hood_monitor.py

      - name: Commit state files
        if: success() && steps.mode.outputs.mode != 'skip' && steps.mode.outputs.mode != 'preview'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for file in state.json weekly_state.json beta_cache.json app_rank_cache.json *_state.json *_weekly_state.json *_beta_cache.json *_app_rank_cache.json; do
            if [ -f "$file" ]; then
              git add -f -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore: update state [skip ci]"
          git pull --rebase
          git push
