name: Monitor V2 Scheduler

on:
  schedule:
    # Keep one non-hour-boundary trigger. The v2 planner gates market, source,
    # close, and weekly work; a later run replays missed five-minute bars.
    - cron: '4/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  production:
    uses: ./.github/workflows/monitor_v2_production.yml
    with:
      mode: tick
    secrets: inherit
