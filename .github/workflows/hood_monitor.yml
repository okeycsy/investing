name: Monitor V2 Scheduler

on:
  push:
    branches: ['main']
    paths:
      - '.github/scheduler_probe'
  schedule:
    # This established workflow ID remains the sole schedule owner. GitHub may
    # delay or drop events; the called production tick replays missing 5m bars.
    - cron: '4-59/5 4-19 * * 1-5'
      timezone: 'America/New_York'
    - cron: '24,54 0-3,20-23 * * 1-5'
      timezone: 'America/New_York'
    - cron: '24 */2 * * 0,6'
      timezone: 'America/New_York'
    - cron: '13 8 * * 1'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  production:
    uses: ./.github/workflows/monitor_v2_production.yml
    with:
      mode: tick
    secrets: inherit
