name: SEC Access Probe

on:
  push:
    branches: ['main']
    paths:
      - '.github/sec_probe_request'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe SEC endpoints
        env:
          SEC_CONTACT: maybe2213@naver.com
        run: |
          USER_AGENT="okeycsy TickerMonitor/1.0 ${SEC_CONTACT}"
          DATA_STATUS=$(curl --compressed -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: ${USER_AGENT}" \
            -H 'Accept-Encoding: gzip, deflate' \
            'https://data.sec.gov/submissions/CIK0001674101.json')
          echo "data.sec.gov submissions: ${DATA_STATUS}"

          sleep 2

          ARCHIVE_STATUS=$(curl --compressed -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: ${USER_AGENT}" \
            -H 'Accept-Encoding: gzip, deflate' \
            'https://www.sec.gov/Archives/edgar/data/1628280/000162828026045755/wk-form4_1782504625.xml')
          echo "www.sec.gov Archives: ${ARCHIVE_STATUS}"
