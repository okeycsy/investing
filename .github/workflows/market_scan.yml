name: VRT Market Scan

on:
  schedule:
    # Router sends once at NYSE official close + 120 minutes.
    - cron: '0,30 17-23 * * 1-5'
  workflow_dispatch:
    inputs:
      ticker:
        description: '단일 종목 스캔 ticker'
        required: false
        default: 'VRT'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scheduler dependency
        if: github.event_name != 'workflow_dispatch'
        run: pip install 'pandas_market_calendars>=5.4.0,<6.0'

      - name: Determine scan timing
        id: timing
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "dispatch_key=" >> $GITHUB_OUTPUT
            echo "reason=manual dispatch" >> $GITHUB_OUTPUT
            exit 0
          fi

          python market_calendar.py market_scan --github-output "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.timing.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run market scan
        if: steps.timing.outputs.should_run == 'true'
        env:
          MARKET_SCAN_WEBHOOK: ${{ secrets.MARKET_SCAN_WEBHOOK }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SCHEDULED_RUN:       ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          SCHEDULE_DISPATCH_KEY: ${{ steps.timing.outputs.dispatch_key }}
        run: |
          TICKER="${{ github.event.inputs.ticker }}"
          if [ -z "$TICKER" ]; then
            TICKER="VRT"
          fi
          echo "▶ 단일 종목 모드: $TICKER"
          python market_scan.py --ticker "$TICKER"
