name: VRT Market Scan

on:
  schedule:
    # KST 07:00 = UTC 22:00 (전날) — 장 마감 후 VRT 확정 데이터 기준
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      ticker:
        description: '단일 종목 스캔 ticker'
        required: false
        default: 'VRT'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market scan
        env:
          MARKET_SCAN_WEBHOOK: ${{ secrets.MARKET_SCAN_WEBHOOK }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TICKER="${{ github.event.inputs.ticker }}"
          if [ -z "$TICKER" ]; then
            TICKER="VRT"
          fi
          echo "▶ 단일 종목 모드: $TICKER"
          python market_scan.py --ticker "$TICKER"
