name: Live Smoke Test

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/live_smoke.yml'
      - 'backtest.py'
      - 'hood_monitor.py'
      - 'HOOD_MONITOR_PRODUCT.md'
      - 'live_smoke.py'
      - 'market_scan.py'
      - 'monitor_config.md'
      - 'monitor_config.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/hood_monitor.yml'

  workflow_dispatch:
    inputs:
      require_slack:
        description: 'Slack webhook 없으면 실패 처리'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  live-smoke:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[alert-preview]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live smoke checks
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MARKET_SCAN_WEBHOOK: ${{ secrets.MARKET_SCAN_WEBHOOK }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_LEGACY_USER_AGENT: ${{ secrets.SEC_LEGACY_USER_AGENT }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          SEC_DATA_MODE: yahoo
          SEC_ARCHIVE_MODE: yahoo
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m unittest discover -s tests -v

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.require_slack }}" != "true" ]; then
            python live_smoke.py --no-slack
            exit 0
          fi

          python live_smoke.py --require-slack
