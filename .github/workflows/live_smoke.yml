name: Live Smoke Test

on:
  workflow_dispatch:
    inputs:
      require_slack:
        description: 'Slack webhook 없으면 실패 처리'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live smoke checks
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MARKET_SCAN_WEBHOOK: ${{ secrets.MARKET_SCAN_WEBHOOK }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_LEGACY_USER_AGENT: ${{ secrets.SEC_LEGACY_USER_AGENT }}
        run: |
          if [ "${{ github.event.inputs.require_slack }}" = "true" ]; then
            python live_smoke.py --require-slack
          else
            python live_smoke.py
          fi
