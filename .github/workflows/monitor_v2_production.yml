name: Monitor V2 Production

on:
  # Temporary release gate: this push trigger is removed immediately after the
  # one-time canary succeeds. Scheduled production is enabled in that cutover.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/monitor_v2_production.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release action'
        required: true
        type: choice
        default: canary
        options:
          - canary
          - tick
          - doctor
          - status

concurrency:
  group: ticker-monitor-v2-state
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Read workflow trigger time
        id: run-metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            core.setOutput('created_at', run.created_at);

      - name: Install production package
        run: pip install -e . yfinance

      - name: Restore runtime state
        run: investing-monitor --db .runtime/monitor.db restore-state

      - name: Send one labeled Slack canary
        if: github.event_name == 'push' || inputs.mode == 'canary'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: investing-monitor --db .runtime/monitor.db slack-canary --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Run one production tick
        if: inputs.mode == 'tick'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT: maybe2213@naver.com
          V2_PRODUCTION_ENABLED: 'true'
        run: investing-monitor --db .runtime/monitor.db production-tick --scheduled-at "${{ steps.run-metadata.outputs.created_at }}" --trigger "${{ github.event_name }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Run production doctor
        if: inputs.mode == 'doctor'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: investing-monitor --db .runtime/monitor.db doctor --require-secrets

      - name: Show runtime status
        if: inputs.mode == 'status'
        run: investing-monitor --db .runtime/monitor.db status

      - name: Build product quality report
        if: always()
        run: investing-monitor --db .runtime/monitor.db quality-report

      - name: Checkpoint runtime state
        if: always() && (github.event_name == 'push' || inputs.mode == 'canary' || inputs.mode == 'tick')
        run: investing-monitor --db .runtime/monitor.db checkpoint-state --run-id "${{ github.run_id }}-final"
